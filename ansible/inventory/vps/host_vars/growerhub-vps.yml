---
ansible_user: root
ansible_port: 22
ansible_python_interpreter: /usr/bin/python3
ansible_ssh_private_key_file: "{{ lookup('env', 'GH_VPS_SSH_KEY') }}"
ansible_ssh_args: >-
  -o ControlMaster=no
  -o IdentitiesOnly=yes
  -o ConnectionAttempts=3
  -o ConnectTimeout=30
  -o ServerAliveInterval=15
  -o ServerAliveCountMax=3
ansible_ssh_retries: 3

server_timezone: "Europe/Moscow"

postgresql_version: 16
postgresql_conf_dir: "/etc/postgresql/{{ postgresql_version }}/main"
postgresql_conf_path: "{{ postgresql_conf_dir }}/postgresql.conf"
pg_hba_conf_path: "{{ postgresql_conf_dir }}/pg_hba.conf"

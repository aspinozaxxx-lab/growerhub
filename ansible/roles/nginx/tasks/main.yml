---
- name: Ensure Nginx is installed
  ansible.builtin.apt:
    name: nginx
    update_cache: true
    state: present

- name: Validate Nginx profile values
  ansible.builtin.assert:
    that:
      - nginx_certbot_install_method in ['apt', 'snap']
      - nginx_firmware_backend in ['java', 'legacy']
      - nginx_static_deploy_method in ['copy', 'archive']
      - nginx_domain | length > 0
    fail_msg: "Nginx profile variables zadany neverno."

- name: Check local frontend dist
  delegate_to: localhost
  become: false
  ansible.builtin.find:
    paths: "{{ nginx_static_src }}"
    recurse: true
    file_type: file
    get_checksum: true
  register: nginx_static_files
  when: nginx_deploy_static

- name: Validate local frontend dist
  ansible.builtin.assert:
    that:
      - nginx_static_files.matched | int > 0
    fail_msg: "Frontend dist ne najden: {{ nginx_static_src }}. Snachala vypolnite frontend build."
  when: nginx_deploy_static

- name: Calculate frontend release id
  ansible.builtin.set_fact:
    nginx_static_release_id: >-
      {{
        nginx_static_files.files
        | sort(attribute='path')
        | map(attribute='checksum')
        | join
        | hash('sha256')
      }}
  when: nginx_deploy_static

- name: Ensure frontend release directories exist
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ nginx_deploy_user }}"
    group: "{{ nginx_deploy_group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ nginx_releases_dir }}"
      mode: "0755"
    - path: "{{ nginx_current_link | dirname }}"
      mode: "0755"
    - path: "{{ nginx_releases_dir }}/{{ nginx_static_release_id }}"
      mode: "0755"
  when: nginx_deploy_static

- name: Deploy frontend dist to release
  become: true
  ansible.builtin.copy:
    src: "{{ nginx_static_src }}/"
    dest: "{{ nginx_releases_dir }}/{{ nginx_static_release_id }}/"
    owner: "{{ nginx_deploy_user }}"
    group: "{{ nginx_deploy_group }}"
    directory_mode: "0755"
    mode: "0644"
  when:
    - nginx_deploy_static
    - nginx_static_deploy_method == 'copy'

- name: Check completed frontend archive release
  become: true
  ansible.builtin.stat:
    path: "{{ nginx_releases_dir }}/.{{ nginx_static_release_id }}.complete"
  register: nginx_static_archive_marker
  when:
    - nginx_deploy_static
    - nginx_static_deploy_method == 'archive'

- name: Validate archive release path
  ansible.builtin.assert:
    that:
      - nginx_static_release_id is match('^[0-9a-f]{64}$')
      - (nginx_releases_dir ~ '/' ~ nginx_static_release_id).startswith(nginx_releases_dir ~ '/')
    fail_msg: "Put frontend release dlya archive-opredelen neverno."
  when:
    - nginx_deploy_static
    - nginx_static_deploy_method == 'archive'

- name: Deploy frontend archive release
  when:
    - nginx_deploy_static
    - nginx_static_deploy_method == 'archive'
    - not nginx_static_archive_marker.stat.exists
    - not ansible_check_mode
  block:
    - name: Build local frontend archive
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv:
          - tar
          - -C
          - "{{ nginx_static_src }}"
          - -czf
          - "/tmp/growerhub-frontend-{{ nginx_static_release_id }}.tar.gz"
          - "."
        creates: "/tmp/growerhub-frontend-{{ nginx_static_release_id }}.tar.gz"

    - name: Remove incomplete frontend release
      become: true
      ansible.builtin.file:
        path: "{{ nginx_releases_dir }}/{{ nginx_static_release_id }}"
        state: absent

    - name: Recreate frontend release directory
      become: true
      ansible.builtin.file:
        path: "{{ nginx_releases_dir }}/{{ nginx_static_release_id }}"
        state: directory
        owner: "{{ nginx_deploy_user }}"
        group: "{{ nginx_deploy_group }}"
        mode: "0755"

    - name: Extract frontend release archive
      become: true
      ansible.builtin.unarchive:
        src: "/tmp/growerhub-frontend-{{ nginx_static_release_id }}.tar.gz"
        dest: "{{ nginx_releases_dir }}/{{ nginx_static_release_id }}"
        owner: "{{ nginx_deploy_user }}"
        group: "{{ nginx_deploy_group }}"

    - name: Normalize frontend directory modes
      become: true
      ansible.builtin.command:
        argv:
          - find
          - "{{ nginx_releases_dir }}/{{ nginx_static_release_id }}"
          - -type
          - d
          - -exec
          - chmod
          - "0755"
          - "{}"
          - "+"
      changed_when: true

    - name: Normalize frontend file modes
      become: true
      ansible.builtin.command:
        argv:
          - find
          - "{{ nginx_releases_dir }}/{{ nginx_static_release_id }}"
          - -type
          - f
          - -exec
          - chmod
          - "0644"
          - "{}"
          - "+"
      changed_when: true

    - name: Mark frontend archive release complete
      become: true
      ansible.builtin.file:
        path: "{{ nginx_releases_dir }}/.{{ nginx_static_release_id }}.complete"
        state: touch
        owner: "{{ nginx_deploy_user }}"
        group: "{{ nginx_deploy_group }}"
        mode: "0644"
  always:
    - name: Remove local frontend archive
      delegate_to: localhost
      become: false
      ansible.builtin.file:
        path: "/tmp/growerhub-frontend-{{ nginx_static_release_id }}.tar.gz"
        state: absent

- name: Switch current frontend release
  become: true
  ansible.builtin.file:
    src: "{{ nginx_releases_dir }}/{{ nginx_static_release_id }}"
    dest: "{{ nginx_current_link }}"
    state: link
    force: true
    owner: "{{ nginx_deploy_user }}"
    group: "{{ nginx_deploy_group }}"
  when: nginx_deploy_static

- name: Deploy main nginx.conf
  become: true
  ansible.builtin.copy:
    src: etc/nginx/nginx.conf
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - test nginx config
    - reload nginx
    - smoke-check api health

# Proverka tekushchej konfiguracii do izmenenij.
- name: Remove other enabled sites (keep only growerhub.conf)
  become: true
  ansible.builtin.find:
    paths: /etc/nginx/sites-enabled
    file_type: any
  register: enabled_sites

- name: Disable stray sites
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ enabled_sites.files | rejectattr('path','equalto','/etc/nginx/sites-enabled/growerhub.conf') | list }}"
  notify:
    - test nginx config
    - reload nginx
    - smoke-check api health

# HTTPS podgotovka, esli vklyuchen.
- name: Ensure certbot installed when HTTPS enabled
  when: nginx_enable_https
  become: true
  block:
    - name: Install snapd for certbot
      ansible.builtin.apt:
        name: snapd
        state: present
        update_cache: yes
      when: nginx_certbot_install_method == 'snap'

    - name: Install certbot from snap
      community.general.snap:
        name: certbot
        classic: yes
        state: present
      when: nginx_certbot_install_method == 'snap'

    - name: Link certbot binary
      ansible.builtin.file:
        src: /snap/bin/certbot
        dest: /usr/bin/certbot
        state: link
        force: yes
      when: nginx_certbot_install_method == 'snap'

    - name: Install certbot from APT
      ansible.builtin.apt:
        name: certbot
        state: present
        update_cache: true
      when: nginx_certbot_install_method == 'apt'

    - name: Create ACME challenge dir
      ansible.builtin.file:
        path: /var/www/letsencrypt/.well-known/acme-challenge
        state: directory
        mode: "0755"
        owner: www-data
        group: www-data

- name: Check if LE cert exists
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ nginx_domain }}/fullchain.pem"
  register: le_cert

- name: Set flag if cert ready
  ansible.builtin.set_fact:
    nginx_cert_ready: >-
      {{
        nginx_enable_https
        and (le_cert.stat.exists | default(false))
      }}

- name: Deploy site from template
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/growerhub.conf
    mode: "0644"
  notify:
    - test nginx config
    - reload nginx
    - smoke-check api health

- name: Enable site symlink
  ansible.builtin.file:
    src: /etc/nginx/sites-available/growerhub.conf
    dest: /etc/nginx/sites-enabled/growerhub.conf
    state: link
    force: true
  notify:
    - test nginx config
    - reload nginx
    - smoke-check api health

- name: Disable default site if present
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify:
    - test nginx config
    - reload nginx
    - smoke-check api health

- name: nginx -t (assert success)
  ansible.builtin.command: nginx -t
  register: nginx_test
  changed_when: false
  failed_when: nginx_test.rc != 0

# Primenyaem konfiguraciyu do zapuska certbot.
- name: Apply config now before certbot
  ansible.builtin.meta: flush_handlers

# Vypusk sertifikata vozmozhen tolko pri gotovyh domene i email.
- name: Obtain/renew Let’s Encrypt certificate
  when:
    - nginx_enable_https
    - nginx_obtain_certificate
    - nginx_domain | length > 0
    - nginx_letsencrypt_email | length > 0
  become: true
  ansible.builtin.command: >
    certbot certonly --webroot
    -w /var/www/letsencrypt
    -d {{ nginx_domain }} {% for d in nginx_alt_domains %}-d {{ d }} {% endfor %}
    --non-interactive --agree-tos -m {{ nginx_letsencrypt_email }}
    {% if nginx_letsencrypt_staging %}--staging{% endif %}
  args:
    creates: "/etc/letsencrypt/live/{{ nginx_domain }}/fullchain.pem"
  notify:
    - test nginx config
    - reload nginx
    - smoke-check api health

- name: Re-check if LE cert exists (post-issue)
  when: nginx_enable_https
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ nginx_domain }}/fullchain.pem"
  register: le_cert_after

- name: Set flag if cert ready (post-issue)
  when: nginx_enable_https
  ansible.builtin.set_fact:
    nginx_cert_ready: "{{ le_cert_after.stat.exists | default(false) }}"

- name: Re-deploy site with HTTPS server block
  when: nginx_enable_https and nginx_cert_ready
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/growerhub.conf
    mode: "0644"
  notify:
    - test nginx config
    - reload nginx
    - smoke-check api health


# Hook prodleniya perezagruzhaet Nginx posle obnovleniya sertifikata.
- name: Ensure certbot renew hook reloads nginx
  when:
    - nginx_enable_https
    - nginx_cert_ready
  become: true
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/01-reload-nginx.sh
    mode: "0755"
    content: |
      #!/bin/sh
      systemctl reload nginx || true

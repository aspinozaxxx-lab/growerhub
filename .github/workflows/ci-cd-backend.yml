name: CI/CD Backend (Java)

on:
  pull_request:
    paths:
      - "backend/**"
      - "firmware/**"
      - "ansible/**"
      - ".github/workflows/ci-cd-backend.yml"
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - "firmware/**"
      - "ansible/**"
      - ".github/workflows/ci-cd-backend.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: vps
        type: choice
        options:
          - vps
          - legacy

permissions:
  contents: read

concurrency:
  group: backend-main
  cancel-in-progress: true

jobs:
  ci:
    name: CI (java backend)
    runs-on: ubuntu-latest
    outputs:
      firmware_version: ${{ steps.firmware_release.outputs.version }}
      firmware_esp32dev_sha256: ${{ steps.firmware_release.outputs.esp32dev_sha256 }}
      firmware_esp32c3_sha256: ${{ steps.firmware_release.outputs.esp32c3_supermini_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build Grovika firmware release
        working-directory: firmware
        run: pio run -e esp32dev -e esp32c3_supermini

      - name: Package Grovika firmware into backend release
        id: firmware_release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < firmware/.pio/build/esp32dev/firmware.version)"
          c3_version="$(tr -d '\r\n' < firmware/.pio/build/esp32c3_supermini/firmware.version)"
          if [[ ! "$version" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]; then
            echo "Invalid firmware version: $version" >&2
            exit 1
          fi
          if [ "$version" != "$c3_version" ]; then
            echo "Firmware versions differ: esp32dev=$version esp32c3_supermini=$c3_version" >&2
            exit 1
          fi
          release_dir="backend/build/generated-firmware/firmware-release"
          install -d "$release_dir"
          printf 'version=%s\n' "$version" > "$release_dir/manifest.properties"
          for profile in esp32dev esp32c3_supermini; do
            binary="firmware/.pio/build/$profile/firmware.bin"
            test -s "$binary"
            sha256="$(sha256sum "$binary" | awk '{print $1}')"
            install -m 0644 "$binary" "$release_dir/$profile.bin"
            printf '%s.sha256=%s\n' "$profile" "$sha256" >> "$release_dir/manifest.properties"
            echo "${profile}_sha256=$sha256" >> "$GITHUB_OUTPUT"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Ensure Gradle wrapper is executable
        run: chmod +x backend/gradlew

      - name: Gradle test
        working-directory: backend
        run: ./gradlew --no-daemon test

      - name: Gradle build
        working-directory: backend
        run: ./gradlew --no-daemon build -x test

      - name: Upload backend jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/app.jar
          if-no-files-found: error

  deploy_vps:
    name: Deploy backend to VPS
    runs-on: ubuntu-latest
    needs: [ ci ]
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.target == 'vps') }}
    environment:
      name: production
      url: https://growerhub.ru/health
    env:
      SSH_HOST: ${{ secrets.IP_VPS_SELECT }}
      SSH_PORT: "22"
      SSH_USER: growerhub-deploy
      SSH_HOST_ED25519_FINGERPRINT: "SHA256:1YnA3HtWolchPXtYujdEGaVM/gZeXMrHjaBG7sdJ3dA"
      RELEASES_DIR: /opt/growerhub/releases/backend
      CURRENT_LINK: /opt/growerhub/current/backend
      SERVICE_NAME: growerhub-java-backend.service
    steps:
      - name: Download backend jar
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend-artifact

      - name: Setup pinned VPS SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY_VPS_HOST }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          scan_file="$(mktemp)"
          ssh-keyscan -T 10 -p "$SSH_PORT" -t ed25519 "$SSH_HOST" > "$scan_file" 2>/dev/null
          actual_fingerprint="$(ssh-keygen -lf "$scan_file" -E sha256 | awk 'NR == 1 { print $2 }')"
          if [ "$actual_fingerprint" != "$SSH_HOST_ED25519_FINGERPRINT" ]; then
            echo "Unexpected VPS SSH host fingerprint: $actual_fingerprint" >&2
            rm -f "$scan_file"
            exit 1
          fi
          install -m 644 "$scan_file" ~/.ssh/known_hosts
          rm -f "$scan_file"

      - name: Verify restricted deploy access
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "test \"\$(id -un)\" = '$SSH_USER'"

      - name: Upload backend release
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RELEASES_DIR/$GITHUB_SHA"
          ssh -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "install -d -m 0750 '$release_dir'"
          rsync -az \
            --omit-dir-times --no-perms --no-owner --no-group \
            -e "ssh -p $SSH_PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            ./backend-artifact/app.jar "$SSH_USER@$SSH_HOST:$release_dir/app.jar.new"
          ssh -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "set -eu; chmod 0640 '$release_dir/app.jar.new'; mv -f '$release_dir/app.jar.new' '$release_dir/app.jar'; test -s '$release_dir/app.jar'"

      - name: Switch backend release with rollback
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" <<EOF
          set -euo pipefail
          release_dir="$RELEASES_DIR/$GITHUB_SHA"
          old_target="\$(readlink -f "$CURRENT_LINK" 2>/dev/null || true)"
          next_link="$CURRENT_LINK.next"

          ln -sfn "\$release_dir" "\$next_link"
          mv -Tf "\$next_link" "$CURRENT_LINK"
          sudo -n /usr/bin/systemctl restart "$SERVICE_NAME"

          health_ok=0
          for attempt in \$(seq 1 180); do
            if sudo -n /usr/bin/systemctl is-active "$SERVICE_NAME" >/dev/null \
              && curl -fsS http://127.0.0.1:18080/health >/dev/null; then
              health_ok=1
              break
            fi
            sleep 1
          done

          if [ "\$health_ok" -ne 1 ]; then
            if [ -n "\$old_target" ] && [ -d "\$old_target" ]; then
              ln -sfn "\$old_target" "\$next_link"
              mv -Tf "\$next_link" "$CURRENT_LINK"
              sudo -n /usr/bin/systemctl restart "$SERVICE_NAME"
            fi
            sudo -n /usr/bin/journalctl -u "$SERVICE_NAME" --no-pager -n 200 || true
            exit 1
          fi
          EOF

      - name: Verify public backend health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            https://growerhub.ru/health >/dev/null

      - name: Verify published Grovika firmware
        shell: bash
        env:
          FIRMWARE_VERSION: ${{ needs.ci.outputs.firmware_version }}
          ESP32DEV_SHA256: ${{ needs.ci.outputs.firmware_esp32dev_sha256 }}
          ESP32C3_SHA256: ${{ needs.ci.outputs.firmware_esp32c3_sha256 }}
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT
          for profile in esp32dev esp32c3_supermini; do
            binary="$work_dir/$profile.bin"
            curl --fail --silent --show-error \
              --retry 5 --retry-delay 2 --retry-all-errors \
              "https://growerhub.ru/firmware/$FIRMWARE_VERSION.$profile.bin" \
              --output "$binary"
            if [ "$profile" = "esp32dev" ]; then
              expected="$ESP32DEV_SHA256"
            else
              expected="$ESP32C3_SHA256"
            fi
            echo "$expected  $binary" | sha256sum --check --strict
          done

      - name: Remove stale backend releases
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" <<EOF
          set -euo pipefail
          current_target="\$(readlink -f "$CURRENT_LINK")"
          mapfile -t stale_releases < <(
            find "$RELEASES_DIR" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' |
              sort -rn |
              tail -n +6 |
              cut -d' ' -f2-
          )
          for candidate in "\${stale_releases[@]}"; do
            resolved="\$(readlink -f "\$candidate")"
            case "\$resolved" in
              "$RELEASES_DIR"/*)
                if [ "\$resolved" != "\$current_target" ]; then
                  rm -rf -- "\$resolved"
                fi
                ;;
              *)
                echo "Unsafe release cleanup target: \$resolved" >&2
                exit 1
                ;;
            esac
          done
          EOF

  deploy_legacy:
    name: Deploy backend to legacy manually
    runs-on: ubuntu-latest
    needs: [ ci ]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'legacy' }}
    environment:
      name: production
      url: https://growerhub.ru/health
    env:
      SSH_HOST: growerhub.ru
      SSH_PORT: "6733"
      SSH_USER: watering-admin
      DEPLOY_DIR: /opt/growerhub/java-backend
      RUNTIME_DIR: /opt/growerhub/runtime
      SYSTEMD_DIR: /opt/growerhub/systemd
      SERVICE_NAME: growerhub-java-backend.service
      ENV_FILE: /opt/growerhub/env/growerhub-java-backend.env
      JAVA_URL: "https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jre/hotspot/normal/eclipse?project=jdk"
    steps:
      - name: Download backend jar
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend-artifact

      - name: Setup SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: SSH smoke test
        run: |
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "echo 'SSH OK'"

      - name: Prepare remote dirs and Java runtime
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$DEPLOY_DIR' '$RUNTIME_DIR' '$SYSTEMD_DIR'"
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" <<EOF
          set -euo pipefail
          JAVA_DIR="$RUNTIME_DIR/jre-21"
          if [ ! -x "\$JAVA_DIR/bin/java" ]; then
            tmp_dir="\$(mktemp -d)"
            curl -fsSL -o "\$tmp_dir/jre.tar.gz" "$JAVA_URL"
            rm -rf "\$JAVA_DIR"
            mkdir -p "\$JAVA_DIR"
            tar -xzf "\$tmp_dir/jre.tar.gz" -C "\$JAVA_DIR" --strip-components=1
            rm -rf "\$tmp_dir"
          fi
          "\$JAVA_DIR/bin/java" -version
          EOF

      - name: Upload backend jar
        run: |
          rsync -azv \
            --omit-dir-times --no-perms --no-owner --no-group \
            -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            ./backend-artifact/app.jar "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/app.jar.new"

      - name: Deploy jar service
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" <<EOF
          set -euo pipefail
          DEPLOY_DIR="$DEPLOY_DIR"
          RUNTIME_DIR="$RUNTIME_DIR"
          SYSTEMD_DIR="$SYSTEMD_DIR"
          SERVICE_NAME="$SERVICE_NAME"
          ENV_FILE="$ENV_FILE"
          UNIT_FILE="\$SYSTEMD_DIR/\$SERVICE_NAME"

          if ! sudo -n /usr/bin/test -f "\$ENV_FILE"; then
            echo "Env file is missing: \$ENV_FILE" >&2
            exit 1
          fi
          for key in SECRET_KEY SPRING_DATASOURCE_URL SPRING_DATASOURCE_USERNAME SPRING_DATASOURCE_PASSWORD; do
            if ! sudo -n /usr/bin/grep -Eq "^\${key}=.+$" "\$ENV_FILE"; then
              echo "\$key is missing or empty in \$ENV_FILE" >&2
              exit 1
            fi
          done

          if ! sudo -n /usr/bin/grep -Eq '^MQTT_HOST=.+$' "\$ENV_FILE"; then
            sudo -n /bin/sed -i '\$a MQTT_HOST=127.0.0.1' "\$ENV_FILE"
          elif sudo -n /usr/bin/grep -Eq '^MQTT_HOST=172\\.17\\.0\\.1$' "\$ENV_FILE"; then
            sudo -n /bin/sed -i 's/^MQTT_HOST=.*/MQTT_HOST=127.0.0.1/' "\$ENV_FILE"
          fi
          if ! sudo -n /usr/bin/grep -Eq '^MQTT_PORT=.+$' "\$ENV_FILE"; then
            sudo -n /bin/sed -i '\$a MQTT_PORT=1883' "\$ENV_FILE"
          fi

          mkdir -p "\$DEPLOY_DIR/firmware_binaries"
          find "\$DEPLOY_DIR" -mindepth 1 -maxdepth 1 \
            ! -name 'app.jar' \
            ! -name 'app.jar.new' \
            ! -name 'firmware_binaries' \
            -exec rm -rf {} +
          mv "\$DEPLOY_DIR/app.jar.new" "\$DEPLOY_DIR/app.jar"

          cat > "\$UNIT_FILE" <<UNIT
          [Unit]
          Description=GrowerHub Java Backend
          After=network-online.target mosquitto.service
          Wants=network-online.target

          [Service]
          Type=simple
          User=watering-admin
          WorkingDirectory=\$DEPLOY_DIR
          EnvironmentFile=\$ENV_FILE
          Environment=SERVER_PORT=18080
          ExecStart=\$RUNTIME_DIR/jre-21/bin/java -jar \$DEPLOY_DIR/app.jar
          Restart=always
          RestartSec=5
          SuccessExitStatus=143

          [Install]
          WantedBy=multi-user.target
          UNIT

          if command -v docker >/dev/null 2>&1; then
            sudo -n /usr/bin/docker rm -f growerhub-java-backend >/dev/null 2>&1 || true
          fi

          sudo -n /usr/bin/systemctl link --force "\$UNIT_FILE"
          sudo -n /usr/bin/systemctl daemon-reload
          sudo -n /usr/bin/systemctl enable "\$SERVICE_NAME"
          sudo -n /usr/bin/systemctl restart "\$SERVICE_NAME"
          sudo -n /usr/bin/systemctl --no-pager --full status "\$SERVICE_NAME"
          EOF

      - name: Verify backend health and MQTT
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" <<EOF
          set -euo pipefail
          ok=0
          for i in \$(seq 1 180); do
            if sudo -n /usr/bin/curl -fsS http://127.0.0.1:18080/health >/tmp/health.json 2>/tmp/health.err; then
              ok=1
              sudo -n /usr/bin/cat /tmp/health.json
              break
            fi
            echo "healthcheck attempt \$i failed: \$(sudo -n /usr/bin/cat /tmp/health.err 2>/dev/null || true)"
            sleep 1
          done
          if [ "\$ok" -ne 1 ]; then
            sudo -n /usr/bin/journalctl -u "$SERVICE_NAME" --no-pager -n 200 || true
            exit 1
          fi

          logs_file="\$(mktemp)"
          sudo -n /usr/bin/journalctl -u "$SERVICE_NAME" --since "10 minutes ago" --no-pager > "\$logs_file"
          if grep -Eq "MQTT (publisher|subscriber) failed to start" "\$logs_file"; then
            sudo -n /usr/bin/journalctl -u "$SERVICE_NAME" --no-pager -n 200 || true
            rm -f "\$logs_file"
            exit 1
          fi

          mqtt_ok=0
          for i in \$(seq 1 60); do
            sudo -n /usr/bin/journalctl -u "$SERVICE_NAME" --since "10 minutes ago" --no-pager > "\$logs_file"
            if grep -q "MQTT publisher connected" "\$logs_file" && grep -q "MQTT subscriber connected" "\$logs_file"; then
              mqtt_ok=1
              break
            fi
            sleep 1
          done
          if [ "\$mqtt_ok" -ne 1 ]; then
            echo "MQTT publisher/subscriber did not connect" >&2
            sudo -n /usr/bin/journalctl -u "$SERVICE_NAME" --no-pager -n 200 || true
            rm -f "\$logs_file"
            exit 1
          fi
          rm -f "\$logs_file"
          if command -v docker >/dev/null 2>&1; then
            sudo -n /usr/bin/docker image rm growerhub-backend:local >/dev/null 2>&1 || true
          fi
          EOF

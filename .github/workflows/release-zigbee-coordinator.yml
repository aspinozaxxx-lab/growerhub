name: Release Zigbee coordinator packages

on:
  push:
    tags:
      - "coordinator-v*"

permissions:
  contents: write

jobs:
  check-connector:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up ARM emulation
        uses: docker/setup-qemu-action@v3

      - name: Test packaged connector with isolated Mosquitto 2.0.22
        env:
          CONNECTOR_PLATFORM: ${{ matrix.platform }}
        run: sh zigbee_coordinator/test-connector.sh

  release:
    needs: [ check-connector ]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Windows launcher process isolation
        shell: pwsh
        run: ./zigbee_coordinator/test-windows-launchers.ps1

      - name: Build packages
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Replace("coordinator-", "")
          ./zigbee_coordinator/build-release.ps1 -Version $version

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            ./zigbee_coordinator/dist/*.zip `
            --title "GrowerHub coordinator ${{ github.ref_name }}" `
            --generate-notes

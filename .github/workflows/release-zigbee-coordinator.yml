name: Release Zigbee coordinator packages

on:
  push:
    tags:
      - "coordinator-v*"

permissions:
  contents: write

jobs:
  check-connector:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test isolated connector with packaged Mosquitto version
        run: >-
          docker run --rm --network none --user 0 --entrypoint sh
          --mount type=bind,source="$PWD",target=/workspace,readonly
          eclipse-mosquitto:2.0.22
          /workspace/zigbee_coordinator/test-connector.sh

  release:
    needs: [ check-connector ]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build packages
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Replace("coordinator-", "")
          ./zigbee_coordinator/build-release.ps1 -Version $version

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            ./zigbee_coordinator/dist/*.zip `
            --title "GrowerHub coordinator ${{ github.ref_name }}" `
            --generate-notes
